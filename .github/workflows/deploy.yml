name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN, applied to every job below (CodeQL
# actions/missing-workflow-permissions, alerts #1-3). Without this block the
# repository default applies, which is read-WRITE on repos created before
# Feb 2023 — a needlessly broad token sitting in the same job as
# CLOUDFLARE_API_TOKEN. Nothing here needs write: `check` and `build` only
# check out and run node, and `deploy` authenticates to Cloudflare with its
# own secret, not GITHUB_TOKEN. Add a narrower per-job override rather than
# widening this if some future job needs to write.
permissions:
  contents: read

jobs:
  # The required status check. Branch protection keys on the exact job name
  # "Syntax check" — do not rename it. It covers EVERY file under src/, not just
  # the entry point: `node --check` validates one file at a time and does not
  # follow imports, so checking only src/index.js would go green while an
  # imported module was unparseable. xargs exits non-zero if any file fails.
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check JS syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      # `node --check` doesn't follow imports and esbuild treats an unresolved
      # identifier as a global, so neither gate sees a module using another
      # module's export without importing it. This does. Pure node, no install.
      - name: Check cross-module references
        run: node scripts/check-module-refs.mjs
      # The static check above cannot see a name used inside a template nested
      # within a `${...}` substitution — that blind spot shipped /es/hourly as a
      # 502. This runs every renderer in BOTH languages, which is ground truth.
      - name: Check renderers (both languages)
        run: node scripts/check-renders.mjs
      # /api/health is the status relation of every api-catalog entry, and a
      # regression there is invisible by construction: a broken health check
      # still returns a cheerful 200. This drives the real cron recorder, writer
      # and reporter against a stubbed KV — centrally, that a refresh which
      # re-stores identical content must NOT move `dataChangedAt`, the signal
      # that a feed is serving frozen data. Pure node, no install.
      - name: Check /api/health
        run: node scripts/test-health.mjs
      # The pollen scrape is the one upstream that publishes no API, and HHD
      # changes its URL shape without notice. When a matcher stops matching
      # NOTHING fails: the index fetches, an older slug matches, that page parses
      # into four valid groups, and the KV entry is rewritten on schedule — so
      # health reports fresh while the count silently stops advancing. That ran
      # for three days in Aug 2026. Pins both URL formats and both path casings.
      - name: Check pollen index parsing
        run: node scripts/test-pollen-parse.mjs
      # decodeEntities() decodes Google News titles, and titles reach markdown
      # UNESCAPED (home.js emits `- [${n.title}](${n.link})`), so the Worker's
      # esc() is not a backstop. Decoding in stages let one stage's output be
      # re-scanned by the next, turning `&amp;lt;script&amp;gt;` into a live
      # `<script>`. The fix is a single regex pass; this pins it, because
      # "simplifying" it back into a readable .replace() chain reintroduces the
      # hole with nothing failing. Pure node, no install.
      - name: Check entity decoding
        run: node scripts/test-decode-entities.mjs

  # Build gate: parse wrangler.jsonc and bundle the Worker without uploading.
  # Catches config/bundling errors and the compat-date/wrangler-pin coupling
  # that `node --check` can't see — before they reach the production deploy.
  # Uses the lockfile's pinned wrangler (npm ci), so CI, local dev, and this
  # dry-run all run the identical version. No auth needed: --dry-run uploads
  # nothing. This IS a required status check alongside "Syntax check" (both are
  # listed in new-relo-main-ruleset), and the deploy job also depends on it, so a
  # broken build can neither be merged nor ship to prod.
  build:
    name: Build check (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build without uploading
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [check, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize production deploys: two quick squash-merges otherwise start
    # racing deploys, and wrangler is last-write-wins, so the older code could
    # land last. Queue (don't cancel) so every merged commit still deploys, in
    # order.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
