name: Claude

# Mention the trigger phrase (default "@claude") in an issue, an issue comment,
# a PR review, or a PR review comment and Claude picks up the whole thread as
# context and does what it was asked.
#
# Deliberately unconstrained on our end (owner policy, 2026-08-15): no
# --max-turns cap, no --disallowedTools, no restricted Bash allowlist. The
# intent is "do what we ask," so the tool surface is opened rather than
# curated. Narrow it here if that ever stops being the intent.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

# NOTE: still deliberately no `if:` guard on the trigger PHRASE.
#
# The usual pattern short-circuits with `contains(github.event.comment.body,
# '@claude')` to save runner minutes. GitHub expressions have no toLower(), and
# contains() IS case-sensitive, so that guard silently drops "@Claude" — the
# exact spelling a human is most likely to type at the start of a sentence.
# A dropped trigger looks identical to a broken workflow, so phrase matching
# stays with the action, which does it case-insensitively.
#
# The job-level `if:` below filters on the ACTOR instead, which is a different
# thing and carries none of that risk — see the comment on it.

# LOOP RISK — the action ships no documented self-trigger prevention.
# GitHub's recursion rule ("events triggered by GITHUB_TOKEN will not create
# a new workflow run") is NOT a reliable backstop here, because the action
# resolves its token as
#   steps.run.outputs.github_token || inputs.github_token || github.token
# and the first of those is the Claude App token, which is NOT GITHUB_TOKEN
# and therefore DOES create new workflow runs. So a workflow-authored comment
# echoing the trigger phrase can re-fire this workflow.
#
# What bounds it is the SHAPE of the one bot path allowed, not the identity:
# the job-level `if:` admits a bot only on `issues`/`opened` carrying the
# `pollen-watch` label. Claude answers by commenting, so its replies — under
# claude[bot] OR under the github.token fallback's github-actions[bot] — can
# never satisfy that condition. A loop would require this workflow to OPEN a
# labelled issue, which it does not do.
#
# If a loop ever does start, narrow that `if:` further or add
# exclude_comments_by_actor. Never rely on the platform recursion rule.

jobs:
  claude:
    name: Claude
    runs-on: ubuntu-latest

    # Skip bot-authored events, with ONE deliberately narrow exception.
    #
    # Measured on #184: one @claude interaction spawned TWO extra no-op runs
    # (31919355089, 31919520557), both from claude[bot]'s own reply comments
    # starting a runner that immediately exited. The type check removes those.
    #
    # Safe because it filters on actor type, NOT on the trigger phrase — so
    # it cannot reintroduce the "@Claude" case-sensitivity failure that the
    # phrase-guard note above exists to prevent. Verified identities:
    #   reloru       -> type User  (owner, and Claude Code cloud sessions)
    #   claude[bot]  -> type Bot   (this workflow's own replies)
    #
    # THE EXCEPTION (2026-09-09): pollen-watch.yml files an issue when HHD
    # publishes a pollen count /pollen failed to pick up — the site's most
    # repetitive failure, four occurrences in five weeks. It posts under
    # GITHUB_TOKEN, so it lands as github-actions[bot] and the type check
    # alone would drop it, leaving the issue to sit until a human noticed.
    #
    # It is scoped to a single event shape rather than to the identity,
    # because identity alone is NOT enough to bound the loop. The action
    # resolves its token as
    #   steps.run.outputs.github_token || inputs.github_token || github.token
    # and that last fallback posts as github-actions[bot] too — so allowing
    # that login on the COMMENT path would let a Claude-authored comment
    # containing the trigger phrase re-fire this workflow.
    #
    # Requiring `issues` + `opened` + the `pollen-watch` label makes the loop
    # structurally impossible instead of merely unlikely: Claude answers by
    # COMMENTING, never by opening a labelled issue, and every bot comment
    # (its own included) still fails the type check. `labeled` and `assigned`
    # from a bot are excluded too — only the creation event qualifies.
    #
    # Keep this in sync with `allowed_bots` below: the action performs its own
    # actor check, so BOTH must name github-actions[bot] or the path is dead.
    if: >-
      github.event.sender.type != 'Bot'
      || (github.event_name == 'issues'
          && github.event.action == 'opened'
          && github.event.sender.login == 'github-actions[bot]'
          && contains(github.event.issue.labels.*.name, 'pollen-watch'))

    # Wide by design — Claude opens branches and PRs, comments, and reads CI.
    # `contents: write` is what lets it push a branch; it still cannot push to
    # `main`, which is protected by new-relo-main-ruleset (PR mandatory,
    # linear history, both required checks) — see docs/ops/ci-cd.md. That
    # ruleset, not this token, is the backstop on production.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so Claude can read context, diff against main, and
          # rebase/merge without a shallow-clone surprise.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # ONE bot login, never `"*"`. See the job-level `if:` above — the
          # two are a pair and must be changed together.
          #
          # This does NOT exist so "Claude can trigger it". Measured on issue
          # #185 (2026-08-15), a comment posted from a Claude Code CLOUD
          # session reports as:
          #     user.login               : reloru
          #     user.type                : User
          #     author_association       : OWNER
          #     performed_via_github_app : claude
          # The GitHub UI renders that `performed_via_github_app` as an app
          # badge, which reads as "a bot commented" — but the ACTOR the
          # action's permission check evaluates is `reloru`, a User with
          # write access. Cloud-session comments have always triggered
          # through the ordinary human path and still need no bot entry.
          #
          # It exists for exactly one thing: pollen-watch.yml's issue, filed
          # under GITHUB_TOKEN as github-actions[bot]. The action runs its own
          # actor check, so the job-level `if:` alone cannot let that through.
          #
          # The loop risk this used to guard against is now handled by SHAPE,
          # not by absence. The action ships no self-trigger prevention and
          # GITHUB_TOKEN recursion prevention is not a backstop here (the
          # Claude App token is not GITHUB_TOKEN and does create runs), so the
          # `if:` above admits only `issues`/`opened` carrying the
          # `pollen-watch` label. A comment from this login — including the
          # action's own github.token fallback — never reaches the runner.
          #
          # `"*"` remains actively unsafe and must never be used: the repo is
          # PUBLIC and the action's docs/security.md states "A bot that
          # matches an entry does not need to be installed on your repository
          # or have write access", so `"*"` hands bare Bash + contents: write
          # to any bot account that can comment. An earlier revision used
          # `"*"` and claimed otherwise; that was wrong.
          allowed_bots: "github-actions[bot]"

          # Lets Claude read CI: get_ci_status, get_workflow_run_details,
          # download_job_log. Pairs with `actions: read` above — both are
          # required, one grants the token scope and one turns the tools on.
          additional_permissions: |
            actions: read

          # Full standard toolset. Bare `Bash` (no parenthesised command
          # filter) permits any shell command, which is the point here.
          #
          # To go further still, swap the whole --allowedTools line for
          # `--dangerously-skip-permissions`, which bypasses the permission
          # layer outright instead of enumerating it.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,NotebookEdit,Glob,Grep,WebFetch,WebSearch,TodoWrite,Task"
